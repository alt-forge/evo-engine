[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoengine"
version = "0.0.1"
description = "Agent-based evolution simulation engine with neural network agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["evoengine*"]

[tool.setuptools.package-data]
"evoengine.view" = ["assets/fonts/*.ttf"]